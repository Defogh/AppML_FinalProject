<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Blunder prediction pipeline</title>
  <desc id="desc">Compact pipeline diagram with transparent background showing PGN input, parsing, feature creation, metadata branches, splits, model training, and risk scoring.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#21313b"/>
    </marker>
    <style>
      text { font-family: Inter, Helvetica, Arial, sans-serif; }
      .title { font-size: 44px; font-weight: 760; fill: #17242c; }
      .subtitle { font-size: 21px; font-weight: 500; fill: #586872; }
      .label { font-size: 25px; font-weight: 760; fill: #17242c; }
      .note { font-size: 18px; font-weight: 560; fill: #4d5d67; }
      .branch { font-size: 16px; font-weight: 760; fill: #61717b; }
      .line { fill: none; stroke: #21313b; stroke-width: 3.6; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #72818a; stroke-width: 3.1; marker-end: url(#arrow); }
    </style>
  </defs>

  <text class="title" x="80" y="85">Blunder Prediction Pipeline</text>
  <text class="subtitle" x="80" y="122">Core features vs. core features plus metadata</text>

  <!-- Main row -->
  <rect x="90" y="215" width="230" height="115" rx="18" fill="#fff8e3" stroke="#d9ac33" stroke-width="2.5"/>
  <text class="label" x="135" y="265">PGN.zst</text>
  <text class="note" x="128" y="298">%eval games</text>

  <rect x="420" y="215" width="230" height="115" rx="18" fill="#eaf4ff" stroke="#4d8dce" stroke-width="2.5"/>
  <text class="label" x="467" y="265">Parse</text>
  <text class="note" x="456" y="298">per-ply rows</text>

  <rect x="750" y="215" width="260" height="115" rx="18" fill="#eaf4ff" stroke="#4d8dce" stroke-width="2.5"/>
  <text class="label" x="801" y="265">Features</text>
  <text class="note" x="787" y="298">eval, material, clock</text>

  <rect x="1160" y="215" width="280" height="115" rx="18" fill="#fff0e7" stroke="#d27b4c" stroke-width="2.5"/>
  <text class="label" x="1224" y="265">Splits</text>
  <text class="note" x="1190" y="298">train / valid / cal / test</text>

  <path class="line" d="M320 272.5 H410"/>
  <path class="line" d="M650 272.5 H740"/>
  <path class="line" d="M1010 272.5 H1150"/>

  <!-- Feature branches -->
  <path class="line-soft" d="M880 330 V405 H430 V485"/>
  <path class="line-soft" d="M880 330 V485"/>
  <text class="branch" x="456" y="392">core only</text>
  <text class="branch" x="903" y="392">+ metadata</text>

  <rect x="260" y="485" width="340" height="115" rx="18" fill="#eef8f0" stroke="#5ca266" stroke-width="2.5"/>
  <text class="label" x="325" y="532">No metadata</text>
  <text class="note" x="333" y="563">board + eval context</text>

  <rect x="710" y="485" width="340" height="115" rx="18" fill="#f4efff" stroke="#8a67c7" stroke-width="2.5"/>
  <text class="label" x="785" y="532">Metadata</text>
  <text class="note" x="763" y="563">Elo + time control</text>

  <!-- Model and output -->
  <rect x="1130" y="635" width="340" height="115" rx="18" fill="#eaf8f7" stroke="#3f9c94" stroke-width="2.5"/>
  <text class="label" x="1207" y="682">Models</text>
  <text class="note" x="1180" y="713">LightGBM / XGBoost</text>

  <rect x="1130" y="795" width="340" height="75" rx="18" fill="#fff3f4" stroke="#c95f69" stroke-width="2.5"/>
  <text class="label" x="1175" y="842">5-move risk score</text>

  <!-- Branches merge into model box; routed below branch boxes to avoid crossings. -->
  <path class="line-soft" d="M600 542.5 H665 V690 H1120"/>
  <path class="line-soft" d="M1050 542.5 H1085 V690 H1120"/>

  <!-- Split feeds model from above. -->
  <path class="line" d="M1300 330 V625"/>
  <path class="line" d="M1300 750 V785"/>
</svg>
